[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-browser-sidecar"
version = "0.3.0"
description = "Isolated structured browser sidecar for Loki"
requires-python = ">=3.12"
dependencies = [
  "browser-use==0.13.8",
]

[project.scripts]
loki-browser-sidecar = "loki_browser_sidecar.server:main"

[tool.setuptools.packages.find]
where = ["src"]
