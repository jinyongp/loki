name: Loki release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Stable 0.2.x version (empty selects the next patch)
        type: string
        default: ''
      publish:
        description: Publish the accepted release and installers
        type: boolean
        default: false
      force_rebuild:
        description: Rebuild every supported target with cold product inputs
        type: boolean
        default: false
      expected_sha:
        description: Optional source SHA bound by the maintainer command
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'loki-release' || format('loki-checks-{0}', github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      manager: ${{ steps.plan.outputs.manager }}
      manager-count: ${{ steps.plan.outputs.manager-count }}
      manager-checks: ${{ steps.plan.outputs.manager-checks }}
      manager-checks-count: ${{ steps.plan.outputs.manager-checks-count }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-count: ${{ steps.plan.outputs.browser-count }}
      full: ${{ steps.plan.outputs.full }}
      full-count: ${{ steps.plan.outputs.full-count }}
      browser-checks: ${{ steps.plan.outputs.browser-checks }}
      browser-checks-count: ${{ steps.plan.outputs.browser-checks-count }}
      full-checks: ${{ steps.plan.outputs.full-checks }}
      full-checks-count: ${{ steps.plan.outputs.full-checks-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_VERSION: ${{ inputs.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          PUBLISH_REQUEST: ${{ inputs.publish }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          args=()
          if test -n "$REQUEST_VERSION"; then args+=(--version "$REQUEST_VERSION"); fi
          if test "$FORCE_REBUILD" = true; then args+=(--force); fi
          python3 scripts/maintainer/tools/release_pipeline.py plan "${args[@]}" --output plan/plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-plan
          path: plan/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  manager-build:
    needs: plan
    if: needs.plan.outputs.manager-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.manager) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - name: Build selected native manager units
        env:
          LOKI_INPUT_CACHE: ${{ github.workspace }}/.release-input-cache
        run: python3 scripts/maintainer/tools/release_pipeline.py manager --plan plan/plan.json --output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: built-${{ matrix.os }}-${{ matrix.arch }}-manager
          path: candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  browser-build:
    needs: plan
    if: needs.plan.outputs.browser-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: .release-input-cache
          key: public-inputs-v1-${{ matrix.os }}-${{ matrix.arch }}-browser-${{ hashFiles('packaging/tools/inputs/**', 'package-lock.json') }}
          restore-keys: public-inputs-v1-${{ matrix.os }}-${{ matrix.arch }}-browser-
      - name: Build selected native browser units
        env:
          LOKI_INPUT_CACHE: ${{ github.workspace }}/.release-input-cache
        run: python3 scripts/maintainer/tools/release_pipeline.py browser --plan plan/plan.json --output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: built-${{ matrix.os }}-${{ matrix.arch }}-browser
          path: candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  full-build:
    needs: plan
    if: needs.plan.outputs.full-count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.full) }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: .release-input-cache
          key: public-inputs-v1-${{ matrix.os }}-${{ matrix.arch }}-full-${{ hashFiles('packaging/tools/inputs/**', 'package-lock.json') }}
          restore-keys: public-inputs-v1-${{ matrix.os }}-${{ matrix.arch }}-full-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.2
          install: true
      - name: Install registry client and authenticated native package tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          printf '%s  %s\n' '80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31' '/usr/share/keyrings/ubuntu-archive-keyring.gpg' | sha256sum --check --strict
          sudo chmod 0644 /usr/share/keyrings/ubuntu-archive-keyring.gpg
      - name: Build selected native full units
        env:
          LOKI_INPUT_CACHE: ${{ github.workspace }}/.release-input-cache
          LOKI_REGISTRY_TOKEN: ${{ github.token }}
          LOKI_BUILD_CACHE: registry
          LOKI_CACHE_WRITE: '1'
        run: python3 scripts/maintainer/tools/release_pipeline.py full --plan plan/plan.json --output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: built-${{ matrix.os }}-${{ matrix.arch }}-full
          path: candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [plan, manager-build, browser-build, full-build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.manager-build.result == 'success' || needs.manager-build.result == 'skipped') && (needs.browser-build.result == 'success' || needs.browser-build.result == 'skipped') && (needs.full-build.result == 'success' || needs.full-build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: built-*
          path: built
      - run: python3 scripts/maintainer/tools/release_pipeline.py assemble --plan plan/plan.json --built built --output publication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-assets
          path: publication/assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain installer pages for deployment and public verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-pages
          path: publication/pages/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain small acceptance metadata
        run: |
          mkdir -p metadata/assets
          cp publication/assets/*.json publication/assets/*.md publication/assets/loki-install.* metadata/assets/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          groups = {}
          for name in ('assets', 'pages'):
              paths = list((Path('publication') / name).rglob('*'))
              if any(path.is_symlink() for path in paths):
                  raise ValueError('release transfer payload must contain regular files')
              files = [path for path in paths if path.is_file()]
              groups[name] = {'files': len(files), 'bytes': sum(path.stat().st_size for path in files)}
          result = {'schema': 1, 'groups': groups, 'public_verifier_avoided_bytes': groups['assets']['bytes']}
          Path('metadata/transfer-inventory.json').write_text(json.dumps(result, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Release transfer payloads\n\n| Payload | Files | Bytes |\n| --- | ---: | ---: |\n')
              for name, group in groups.items():
                  out.write(f"| {name} | {group['files']} | {group['bytes']} |\n")
              out.write('\nPublic verification downloads only installer pages. Actions records per-step transfer durations.\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-metadata
          path: metadata/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  source-checks:
    needs: assemble
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - name: Prepare the pinned native search test prerequisite
        run: python3 scripts/maintainer/tools/prepare_test_tools.py --output test-tools
      - name: Final source contracts and release selection fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go test ./...
          go test -race ./internal/tools ./internal/management ./internal/config ./cmd/loki-manager
          python3 -m unittest discover -s scripts/maintainer/tools -p 'test_*.py'
          python3 -m compileall -q scripts/maintainer/tools
          python3 scripts/maintainer/tools/verify_release_tools.py

  manager-checks:
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.plan.outputs.manager-checks-count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.manager-checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-metadata
          path: publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: built-${{ matrix.os }}-${{ matrix.arch }}-*
          path: publication/native
      - run: python3 scripts/maintainer/tools/release_pipeline.py environment --plan plan/plan.json --mode project-host
      - run: python3 scripts/maintainer/tools/release_pipeline.py materialize --plan plan/plan.json --built publication --output acceptance-candidate --mode manager
      - name: Accept native CLI, upgrade selection, installer and retained user data
        run: |
          python3 scripts/maintainer/tools/accept_manager_bundle.py --candidate acceptance-candidate/manager
          go test ./cmd/loki-manager ./internal/tools ./internal/management ./internal/platform/command ./internal/host/windows
          GH_TOKEN=${{ github.token }} python3 scripts/maintainer/tools/accept_cli_upgrade.py --candidate acceptance-candidate/manager
          python3 scripts/maintainer/tools/accept_public_installer.py --candidate acceptance-candidate/manager
      - name: Accept Linux administrator socket, remembered routing and owned cleanup
        if: matrix.os == 'linux'
        run: python3 scripts/maintainer/tools/accept_system_host.py --candidate acceptance-candidate/manager
      - run: python3 scripts/maintainer/tools/release_gate.py evidence --plan plan/plan.json --publication publication --mode manager --output checks/acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-${{ matrix.os }}-${{ matrix.arch }}-manager
          path: checks/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  browser-checks:
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.plan.outputs.browser-checks-count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser-checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-metadata
          path: publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: built-${{ matrix.os }}-${{ matrix.arch }}-*
          path: publication/native
      - run: python3 scripts/maintainer/tools/release_pipeline.py environment --plan plan/plan.json --mode project-host
      - run: python3 scripts/maintainer/tools/release_pipeline.py materialize --plan plan/plan.json --built publication --output acceptance-candidate --mode project-host
      - name: Allow owned Chrome sandbox on the disposable Linux acceptance runner
        if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/loki-browser-acceptance" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile loki-release-browser /tmp/loki-browser-accept-*/management/tools/browser/generations/*/chrome/chrome flags=(unconfined) { userns, }
          profile loki-release-installer /tmp/loki-installer-accept-*/management/tools/browser/generations/*/chrome/chrome flags=(unconfined) { userns, }
          PROFILE
          sudo apparmor_parser --replace "$RUNNER_TEMP/loki-browser-acceptance"
      - name: Accept both packaged engines, capabilities, installation and connection
        run: |
          python3 scripts/maintainer/tools/accept_browser_candidate.py --candidate acceptance-candidate
          go test ./modules/browser ./internal/transport/toolproxy
          python3 scripts/maintainer/tools/accept_browser_capabilities.py --candidate acceptance-candidate
          python3 scripts/maintainer/tools/accept_public_installer.py --candidate acceptance-candidate --browser
      - name: Remove owned sandbox profile
        if: always() && runner.os == 'Linux'
        run: |
          if test -f "$RUNNER_TEMP/loki-browser-acceptance"; then sudo apparmor_parser --remove "$RUNNER_TEMP/loki-browser-acceptance"; fi
      - run: python3 scripts/maintainer/tools/release_gate.py evidence --plan plan/plan.json --publication publication --mode project-host --output checks/acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-${{ matrix.os }}-${{ matrix.arch }}-project-host
          path: checks/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  full-checks:
    needs: [plan, assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.plan.outputs.full-checks-count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.full-checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: false
      - id: go-cache-paths
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          paths = json.loads(subprocess.check_output(['go','env','-json','GOCACHE','GOMODCACHE'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<GO_CACHE_PATHS\n'+paths['GOCACHE']+'\n'+paths['GOMODCACHE']+'\nGO_CACHE_PATHS\n')
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ${{ steps.go-cache-paths.outputs.paths }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'packaging/tools/inputs/*-source-*.json', 'scripts/maintainer/tools/build_go_vendor.py') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.27.1-${{ hashFiles('go.sum') }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-metadata
          path: publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: built-${{ matrix.os }}-${{ matrix.arch }}-*
          path: publication/native
      - run: python3 scripts/maintainer/tools/release_pipeline.py environment --plan plan/plan.json --mode full
      - run: python3 scripts/maintainer/tools/release_pipeline.py materialize --plan plan/plan.json --built publication --output acceptance-candidate --mode full
      - name: Prepare disposable Docker acceptance runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(config)+'\n')
          PY
          sudo systemctl restart docker
      - name: Accept confined workspace service, revocation and every exact registry digest
        run: |
          python3 scripts/maintainer/tools/prepare_test_tools.py --output test-tools
      - name: Run full source and product acceptance
        run: |
          go test ./internal/config ./internal/tools ./internal/management ./modules/workspace
          python3 scripts/maintainer/tools/accept_full_workspace_candidate.py --candidate acceptance-candidate
      - run: python3 scripts/maintainer/tools/release_gate.py evidence --plan plan/plan.json --publication publication --mode full --output checks/acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-${{ matrix.os }}-${{ matrix.arch }}-full
          path: checks/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  gate:
    needs: [plan, manager-build, browser-build, full-build, assemble, source-checks, manager-checks, browser-checks, full-checks]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-plan
          path: plan
      - name: Download exact release assets for final sealing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-assets
          path: publication/assets
      - name: Download installer pages for Pages deployment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-pages
          path: publication/pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: checks-*
          path: checks
      - name: Require the exact selected cohort and seal publication checksums
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('results.json').write_text(json.dumps({k:v['result'] for k,v in json.loads(os.environ['JOB_RESULTS']).items()}))
          PY
          python3 scripts/maintainer/tools/release_gate.py gate --plan plan/plan.json --output publication --checks checks --results results.json
          mkdir -p accepted/assets
          cp publication/assets/loki-release-lock.json publication/assets/SHA256SUMS accepted/assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-publication-metadata
          path: accepted/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: publication/pages

  publish:
    needs: [plan, gate]
    if: always() && inputs.publish && needs.plan.result == 'success' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download only release assets for publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-assets
          path: publication/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: accepted-publication-metadata
          path: publication
      - name: Verify accepted bytes and source, then create or verify the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.plan.outputs.version }}
        run: |
          (cd publication/assets && sha256sum --check --strict SHA256SUMS)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          sh scripts/maintainer/publish-tag.sh "v$RELEASE" "$GITHUB_SHA"
      - id: release
        uses: releaseway/actions@c054f2de3448e79e5d854155e701e13ad31a520c # v0.3.1
        with:
          tag: v${{ needs.plan.outputs.version }}
          commit: ${{ github.sha }}
          assets: publication/assets/*
          upload-concurrency: '4'
          title: Loki ${{ needs.plan.outputs.version }}
          notes: file
          notes-file: publication/assets/loki-release-notes.md
          notes-existing: verify
          prerelease: 'false'
          latest: 'true'
      - name: Retain publication diagnostics
        if: always() && steps.release.outputs.notes-report != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: releaseway-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.notes-report }}
          if-no-files-found: error

  pages:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verify-public:
    needs: [plan, pages]
    if: always() && needs.plan.result == 'success' && needs.pages.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download only accepted installer pages for public comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-pages
          path: publication/pages
      - env:
          LOKI_RELEASE: ${{ needs.plan.outputs.version }}
        run: python3 scripts/maintainer/tools/verify_public_release.py --expected-directory publication/pages

  summary:
    needs: [plan, gate, publish, pages, verify-public]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Release pipeline\n\n')
              out.write('Publish requested: '+os.environ['PUBLISH']+'\n\n')
              for job, value in results.items():
                  out.write('- '+job+': '+value['result']+'\n')
          if os.environ['PUBLISH'] == 'true' and any(value['result'] != 'success' for value in results.values()):
              raise SystemExit('Requested publication did not complete all release and public delivery gates')
          PY
