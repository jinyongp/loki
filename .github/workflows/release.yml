name: publish accepted release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Git tag for the accepted release.
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA bound by A14 evidence.
        required: true
        type: string
      candidate-artifact:
        description: Workflow artifact containing the verified A14 candidate bundle at its root.
        required: false
        default: loki-release-candidate
        type: string
    outputs:
      release_url:
        description: Published immutable GitHub Release URL.
        value: ${{ jobs.release.outputs.release_url }}
      page_url:
        description: Deployed GitHub Pages URL.
        value: ${{ jobs.pages.outputs.page_url }}

permissions:
  contents: read

concurrency:
  group: loki-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare accepted publication
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download A14 candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate

      - name: Prepare public release assets and installer
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          go run ./tools/release/publishprep \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --output "$GITHUB_WORKSPACE/publication" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --installer-template "$GITHUB_WORKSPACE/tools/release/install.sh.tmpl"

      - name: Store prepared GitHub Release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loki-publication-assets
          path: publication/assets
          if-no-files-found: error
          retention-days: 1

      - name: Store prepared Pages content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loki-publication-pages
          path: publication/pages
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish immutable GitHub Release
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs['release-url'] }}
    steps:
      - name: Check out tag provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download prepared release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loki-publication-assets
          path: publication/assets

      - name: Publish immutable release
        id: publish
        uses: releaseway/actions@5b7090184832d6fc92ccee5b3caa0417d3df9235 # v0.1.0
        with:
          tag: ${{ inputs.tag }}
          commit: ${{ inputs.commit }}
          assets: publication/assets/*
          notes-file: publication/assets/loki-release-notes.md
          title: ${{ inputs.tag }}

  pages:
    name: Publish release-bound installer
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download prepared Pages content
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loki-publication-pages
          path: publication/pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publication/pages

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
