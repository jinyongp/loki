name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: loki-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      released_at: ${{ steps.version.outputs.released_at }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Require main HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify GitHub Action pins are current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_actions_up=$(npm view actions-up version)
          test "$latest_actions_up" = 1.20.1 || {
            echo "actions-up 1.20.1 is stale; latest is $latest_actions_up" >&2
            exit 1
          }
          npm exec --yes actions-up@1.20.1 -- \
            --dir .github \
            --dry-run \
            --json \
            --mode major \
            --style sha \
            --prefer-tags \
            --min-age 0 \
            >"$RUNNER_TEMP/actions-up.raw"
          sed -n '/^{/,$p' "$RUNNER_TEMP/actions-up.raw" >"$RUNNER_TEMP/actions-up.json"
          jq -e '.summary.totalUpdates == 0 and .summary.totalBlockedByMode == 0 and .summary.totalBlockedByAge == 0' \
            "$RUNNER_TEMP/actions-up.json" >/dev/null

      - name: Verify release dependency pins are current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view --repo jinyongp/devtools --json tagName --jq .tagName)" = v0.18.0
          test "$(gh release view --repo cli/cli --json tagName --jq .tagName)" = v2.101.0
          test "$(gh release view --repo BurntSushi/ripgrep --json tagName --jq .tagName)" = 15.2.0
          test "$(gh release view --repo releaseway/actions --json tagName --jq .tagName)" = v0.1.4

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if test -n "$latest_tag"; then
            tag_commit=$(git rev-list -n 1 "$latest_tag")
            release_state=missing
            if release_json=$(gh release view "$latest_tag" --json isDraft 2>/dev/null); then
              if test "$(jq -r '.isDraft' <<<"$release_json")" = true; then
                release_state=draft
              else
                release_state=published
              fi
            fi
            if test "$tag_commit" = "$GITHUB_SHA"; then
              case "$release_state" in
                missing|draft)
                  version=${latest_tag#v}
                  tag=$latest_tag
                  previous_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | sed -n '2p')
                  ;;
                published)
                  echo "current commit is already published as $latest_tag" >&2
                  exit 1
                  ;;
              esac
            elif test "$release_state" != published; then
              echo "latest tag $latest_tag is not a published release and points to another commit" >&2
              exit 1
            fi
          fi
          if test -z "${version:-}"; then
            resolved=$(go run ./tools/release/version --bump "$BUMP")
            version=$(jq -r '.version' <<<"$resolved")
            tag=$(jq -r '.tag' <<<"$resolved")
            previous_tag=$(jq -r '.previous_tag // ""' <<<"$resolved")
          fi
          released_at=$(git show -s --format=%cI "$GITHUB_SHA")
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
            echo "released_at=$released_at"
          } >>"$GITHUB_OUTPUT"

  release-inputs:
    name: Build release inputs (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build native release inputs
        env:
          LOKI_BUILD_CACHE_SCOPE: release-inputs
        run: sh ./scripts/build/build-release-inputs.sh "$RUNNER_TEMP/release-inputs" "${{ matrix.arch }}"

      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loki-release-inputs-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build immutable release
    needs:
      - preflight
      - release-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      core_image: ${{ steps.images.outputs.core_image }}
      browser_image: ${{ steps.images.outputs.browser_image }}
      candidate_artifact: ${{ steps.candidate.outputs.name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: loki-release-inputs-*
          path: ${{ runner.temp }}/release-inputs
          merge-multiple: true

      - name: Restore release input executable modes
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 \
            "$RUNNER_TEMP/release-inputs/devtools/amd64/devtools" \
            "$RUNNER_TEMP/release-inputs/devtools/arm64/devtools" \
            "$RUNNER_TEMP/release-inputs/ripgrep/amd64/rg" \
            "$RUNNER_TEMP/release-inputs/ripgrep/arm64/rg" \
            "$RUNNER_TEMP/release-inputs/gh/amd64/gh" \
            "$RUNNER_TEMP/release-inputs/gh/arm64/gh"

      - name: Build and push candidate images
        id: images
        env:
          LOKI_VERSION: ${{ needs.preflight.outputs.version }}
          LOKI_REVISION: ${{ github.sha }}
          LOKI_DATE: ${{ needs.preflight.outputs.released_at }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          inputs="$RUNNER_TEMP/release-inputs"
          core_ref="ghcr.io/jinyongp/loki:candidate-${GITHUB_SHA}"
          browser_ref="ghcr.io/jinyongp/loki-browser:candidate-${GITHUB_SHA}"
          export LOKI_BUILD_METADATA="$RUNNER_TEMP/core-image.json"
          export LOKI_BUILD_CACHE_SCOPE=loki-core
          ./scripts/build/build-oci.sh "$core_ref" \
            "$inputs/devtools/amd64/devtools" \
            "$inputs/devtools/arm64/devtools" \
            "$inputs/ripgrep/amd64/rg" \
            "$inputs/ripgrep/arm64/rg" \
            "$inputs/gh/amd64/gh" \
            "$inputs/gh/arm64/gh"
          export LOKI_BUILD_METADATA="$RUNNER_TEMP/browser-image.json"
          export LOKI_BUILD_CACHE_SCOPE=loki-browser
          ./scripts/build/build-browser-oci.sh "$browser_ref"
          core_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/core-image.json")
          browser_digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/browser-image.json")
          {
            echo "core_image=ghcr.io/jinyongp/loki@$core_digest"
            echo "browser_image=ghcr.io/jinyongp/loki-browser@$browser_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Require anonymously pullable runtime images
        env:
          CORE_IMAGE: ${{ steps.images.outputs.core_image }}
          BROWSER_IMAGE: ${{ steps.images.outputs.browser_image }}
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$RUNNER_TEMP/docker-anonymous"
          mkdir -p "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$CORE_IMAGE" >/dev/null
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$BROWSER_IMAGE" >/dev/null

      - name: Generate release notes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '# Loki %s\n\n' "$TAG"
            if test -n "$PREVIOUS_TAG"; then
              git log --no-merges --format='- %s (%h)' "$PREVIOUS_TAG..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s (%h)' "$GITHUB_SHA"
            fi
            printf '\n'
          } >"$notes"

      - name: Assemble release metadata and bootstrap
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASED_AT: ${{ needs.preflight.outputs.released_at }}
          CORE_IMAGE: ${{ steps.images.outputs.core_image }}
          BROWSER_IMAGE: ${{ steps.images.outputs.browser_image }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/release/releasebuild \
            --output "$RUNNER_TEMP/release" \
            --version "$VERSION" \
            --source-revision "$GITHUB_SHA" \
            --released-at "$RELEASED_AT" \
            --core-image "$CORE_IMAGE" \
            --browser-image "$BROWSER_IMAGE" \
            --release-notes "$RUNNER_TEMP/release-notes.md" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Assemble candidate evidence
        id: candidate
        env:
          CORE_IMAGE: ${{ steps.images.outputs.core_image }}
          BROWSER_IMAGE: ${{ steps.images.outputs.browser_image }}
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          candidate="$RUNNER_TEMP/candidate"
          go run ./tools/release/evidencebuild \
            --output "$candidate" \
            --source-revision "$GITHUB_SHA" \
            --release-index "$release/release-index.json" \
            --release-manifest "$release/release-manifest.json" \
            --host-binary "$release/loki-linux-amd64" \
            --bootstrap "$release/loki-bootstrap-linux-amd64" \
            --host-assets "$release/host-assets.tar.gz" \
            --toolchain-catalog "$release/toolchain-catalog.json" \
            --provenance "$release/provenance.bundle.json" \
            --notices "$release/notices.tar.gz" \
            --release-notes "$release/release-notes.md" \
            --effective-policy "$release/effective-policy.json" \
            --effective-config "$release/effective-config.toml" \
            --core-image "$CORE_IMAGE" \
            --browser-image "$BROWSER_IMAGE"
          name="loki-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7

  accept:
    name: Release acceptance
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install acceptance prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes acl

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Restore candidate executable modes
        run: chmod 0755 "$RUNNER_TEMP/candidate/inputs/loki" "$RUNNER_TEMP/candidate/inputs/loki-bootstrap"

      - name: Verify candidate publication projection
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          go run ./tools/release/publishprep \
            --candidate "$RUNNER_TEMP/candidate" \
            --output "$RUNNER_TEMP/publication-check" \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --installer-template "$GITHUB_WORKSPACE/tools/release/install.sh.tmpl"
          sh -n "$RUNNER_TEMP/publication-check/pages/install.sh"

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -json ./... -count=1 | tee "$RUNNER_TEMP/go-test.json"
          status=${PIPESTATUS[0]}
          set -e
          if test "$status" -ne 0; then
            jq -r 'select(.Action == "fail" and .Package != null) | .Package' "$RUNNER_TEMP/go-test.json" |
              sort -u |
              while IFS= read -r package; do
                test -n "$package" && printf '::error title=Go test package failed::%s\n' "$package"
              done
            exit "$status"
          fi

      - name: Run Go race tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -json -race ./... -count=1 | tee "$RUNNER_TEMP/go-race-test.json"
          status=${PIPESTATUS[0]}
          set -e
          if test "$status" -ne 0; then
            jq -r 'select(.Action == "fail" and .Package != null) | .Package' "$RUNNER_TEMP/go-race-test.json" |
              sort -u |
              while IFS= read -r package; do
                test -n "$package" && printf '::error title=Go race package failed::%s\n' "$package"
              done
            exit "$status"
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Build all Go packages
        run: go build ./...

      - name: Verify architecture policy
        run: go run ./tools/archcheck

      - name: Verify Go module tidiness
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(go mod tidy -diff)"

      - name: Verify Git diff hygiene
        run: git diff --check

      - name: Run real OCI job acceptance
        run: ./scripts/verify/accept-oci-jobs.sh

      - name: Run release Compose and browser acceptance
        env:
          LOKI_IMAGE: ${{ needs.build.outputs.core_image }}
          LOKI_BROWSER_IMAGE: ${{ needs.build.outputs.browser_image }}
        run: ./scripts/verify/accept-compose.sh

      - name: Run bootstrap acceptance
        run: ./scripts/verify/accept-bootstrap.sh

      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: loki-release-inputs-*
          path: ${{ runner.temp }}/release-inputs
          merge-multiple: true

      - name: Run real devtools integration
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/release-inputs/devtools/amd64/devtools"
          LOKI_DEVTOOLS_BINARY="$RUNNER_TEMP/release-inputs/devtools/amd64/devtools" \
            go test ./internal/devtools -run TestRealProcessInheritsBrokerSecrets -v -count=1

      - name: Verify canonical toolchain bundle
        run: ./scripts/build/build-toolchain-bundle.sh "$RUNNER_TEMP/toolchain-bundle"

  publish:
    name: Publish immutable release
    needs:
      - preflight
      - build
      - accept
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    outputs:
      release_url: ${{ steps.release.outputs['release-url'] }}
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download accepted candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Restore candidate executable modes
        run: chmod 0755 "$RUNNER_TEMP/candidate/inputs/loki" "$RUNNER_TEMP/candidate/inputs/loki-bootstrap"

      - name: Prepare public assets and Pages installer
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          go run ./tools/release/publishprep \
            --candidate "$RUNNER_TEMP/candidate" \
            --output "$GITHUB_WORKSPACE/publication" \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --installer-template "$GITHUB_WORKSPACE/tools/release/install.sh.tmpl"

      - name: Promote accepted OCI image tags
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          CORE_IMAGE: ${{ needs.build.outputs.core_image }}
          BROWSER_IMAGE: ${{ needs.build.outputs.browser_image }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/jinyongp/loki:$TAG" "$CORE_IMAGE"
          docker buildx imagetools create --tag "ghcr.io/jinyongp/loki-browser:$TAG" "$BROWSER_IMAGE"

      - name: Create or verify release tag
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          if test -n "$remote"; then
            test "$remote" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish immutable GitHub Release
        id: release
        uses: releaseway/actions@49c543357d96884d0e5a683c45d45ebd50a8b612 # v0.1.4
        with:
          tag: ${{ needs.preflight.outputs.tag }}
          commit: ${{ github.sha }}
          assets: publication/assets/*
          notes-file: publication/assets/loki-release-notes.md
          title: ${{ needs.preflight.outputs.tag }}
          latest: "true"

      - name: Upload Pages installer
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publication/pages

  pages:
    name: Deploy installer
    needs:
      - preflight
      - publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-public:
    name: Verify public install
    needs:
      - preflight
      - pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify published installer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern loki-install.sh \
            --dir "$RUNNER_TEMP/release"
          for attempt in $(seq 1 20); do
            if curl --fail --location --silent --show-error \
              https://jinyongp.dev/loki/install.sh \
              --output "$RUNNER_TEMP/install.sh" &&
              cmp -s "$RUNNER_TEMP/release/loki-install.sh" "$RUNNER_TEMP/install.sh"; then
              break
            fi
            test "$attempt" -lt 20
            sleep 15
          done
          cmp "$RUNNER_TEMP/release/loki-install.sh" "$RUNNER_TEMP/install.sh"
          sh -n "$RUNNER_TEMP/install.sh"

      - name: Run public source-free installation
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/loki-workspace"
          curl -fsSL https://jinyongp.dev/loki/install.sh | sh -s -- \
            --workspace "$workspace" \
            --create-workspace \
            --prepare-workspace \
            --install-prerequisites \
