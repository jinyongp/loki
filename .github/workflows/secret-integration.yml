name: Secret integration native verification

on:
  push:
    branches: ['verify/secret-integration']
  workflow_dispatch:
    inputs:
      suite_set:
        description: Verification scope; full is required for final acceptance
        type: choice
        default: full
        options: [full, source, compose, compose-package, compose-restore, compose-recovery, compose-paired, native-migration, native-rollback]

permissions:
  contents: read

concurrency:
  group: secret-integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Public-repository standard runners are free. Do not silently start consuming
# a private repository's paid minutes if the repository visibility changes.
# Logs and step summaries retain evidence without storing binary artifacts/caches.
jobs:
  native:
    if: github.event.repository.private == false
    name: ${{ matrix.runner }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (matrix.suite == 'reboot' || startsWith(matrix.suite, 'native-')) && 30 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        suite: ${{ fromJSON(inputs.suite_set == 'source' && '["source","race-cli","race-0","race-1"]' || inputs.suite_set == 'native-rollback' && '["native-rollback"]' || inputs.suite_set == 'native-migration' && '["native-migration"]' || inputs.suite_set == 'compose-paired' && '["package-paired"]' || inputs.suite_set == 'compose-recovery' && '["package-recovery"]' || inputs.suite_set == 'compose-restore' && '["package-restore"]' || inputs.suite_set == 'compose-package' && '["package","package-restore","package-recovery","package-paired"]' || inputs.suite_set == 'compose' && '["package","package-restore","package-recovery","package-paired","values","source","race-cli","race-0","race-1"]' || '["reboot","native-migration","native-rollback","package","package-restore","package-recovery","package-paired","values","source","protected","oci","race-cli","race-0","race-1"]') }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify native execution and prerequisites
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ARCH:$(uname -m):$(go env GOARCH)" in
            X64:x86_64:amd64|ARM64:aarch64:arm64) ;;
            *) echo 'Native architecture mismatch' >&2; exit 1 ;;
          esac
          git rev-parse HEAD
          go version
          uname -a
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker
            docker info >/dev/null
          fi
          docker buildx version
      - name: Prepare the pinned native search test prerequisite
        if: matrix.suite == 'source' || startsWith(matrix.suite, 'race-')
        run: python3 scripts/maintainer/tools/prepare_test_tools.py --output "$RUNNER_TEMP/test-tools"
      - name: Verify source contracts, architecture and build
        if: matrix.suite == 'source'
        run: |
          umask 077
          sh scripts/verify/verify-source.sh
      - name: Run complete race coverage in package shards
        if: startsWith(matrix.suite, 'race-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          umask 077
          # CLI and signing-agent tests launch timing-sensitive external
          # services. Run each complete package sequentially in this job,
          # separate from the other packages' concurrent build/test load.
          if [[ "$SUITE" == race-cli ]]; then
            go test -race -count=1 -timeout=10m ./cmd/loki
            go test -race -count=1 -timeout=10m ./modules/git/signing
            exit 0
          fi
          # Every other package appears in exactly one sorted modulo shard.
          # Both architectures run all three jobs; no test-name filters apply.
          package_list=$(go list ./... | LC_ALL=C sort)
          mapfile -t packages <<< "$package_list"
          selected=()
          shard=${SUITE#race-}
          for index in "${!packages[@]}"; do
            if [[ "${packages[index]}" == loki/cmd/loki || "${packages[index]}" == loki/modules/git/signing ]]; then continue; fi
            if (( index % 2 == shard )); then selected+=("${packages[index]}"); fi
          done
          test "${#selected[@]}" -gt 0
          printf 'race shard %s/2: %s of %s packages\n' "$shard" "${#selected[@]}" "${#packages[@]}"
          go test -race -count=1 -timeout=10m "${selected[@]}"
      - name: Verify real OCI lifecycle, networking and recovery
        if: matrix.suite == 'oci'
        run: sh scripts/verify/accept-oci-jobs.sh
      - name: Build pinned native shipping inputs and verify real Compose isolation
        if: startsWith(matrix.suite, 'package')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          umask 077
          arch=$(go env GOARCH)
          sh scripts/build/build-release-inputs.sh "$RUNNER_TEMP/native-inputs" "$arch"
          image="loki-secret-verification:$GITHUB_SHA"
          python3 scripts/verify/build-secret-native-image.py --inputs "$RUNNER_TEMP/native-inputs" --tag "$image"
          if [[ "$SUITE" == package-restore ]]; then
            sh scripts/verify/accept-secret-compose.sh "$image" restore
          elif [[ "$SUITE" == package-recovery ]]; then
            sh scripts/verify/accept-secret-compose.sh "$image" recovery
          elif [[ "$SUITE" == package-paired ]]; then
            paired_image="loki-secret-verification:$GITHUB_SHA-paired"
            python3 scripts/verify/build-secret-native-image.py --inputs "$RUNNER_TEMP/native-inputs" --tag "$paired_image" --version 0.49.1-dev
            sh scripts/verify/accept-secret-compose.sh "$image" paired "$paired_image"
          else
            sh scripts/verify/accept-secret-compose.sh "$image"
          fi
      - name: Build the hash-verified pinned devtools provider
        if: matrix.suite == 'protected' || matrix.suite == 'values' || matrix.suite == 'reboot' || startsWith(matrix.suite, 'native-')
        run: |
          set -euo pipefail
          umask 077
          provider_root=$(mktemp -d "$RUNNER_TEMP/loki-provider.XXXXXXXX")
          curl --fail --location --retry 3 \
            https://codeload.github.com/jinyongp/devtools/tar.gz/276a78e91479321ba751c5555769a39e6ad05e07 \
            --output "$provider_root/source.tar.gz"
          printf '%s  %s\n' 8dcbca91e738ed0433cef953f35d351571dca829781a0156983f2ae09b92ac86 "$provider_root/source.tar.gz" | sha256sum --check --strict
          mkdir "$provider_root/source"
          tar -xzf "$provider_root/source.tar.gz" --strip-components=1 -C "$provider_root/source"
          (
            cd "$provider_root/source"
            CGO_ENABLED=0 go build -trimpath \
              -ldflags '-X main.version=0.33.0 -X main.commit=276a78e91479321ba751c5555769a39e6ad05e07' \
              -o "$provider_root/devtools" ./cmd/devtools
          )
          # The canary runs the provider as UID1000. Build outputs created under
          # umask077 would otherwise only be executable by the runner owner.
          chmod 0555 "$provider_root/devtools"
          printf 'LOKI_SECRET_TEST_DEVTOOLS=%s\n' "$provider_root/devtools" >> "$GITHUB_ENV"
          if [[ '${{ matrix.suite }}' == values ]]; then
            mkdir "$provider_root/source/cmd/loki-expiry-fixture"
            cp modules/secrets/application/testdata/provider-expired/main.go "$provider_root/source/cmd/loki-expiry-fixture/main.go"
            (
              cd "$provider_root/source"
              CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$provider_root/expiry-fixture" ./cmd/loki-expiry-fixture
            )
            chmod 0555 "$provider_root/expiry-fixture"
            printf 'LOKI_SECRET_TEST_EXPIRED_FIXTURE=%s\n' "$provider_root/expiry-fixture" >> "$GITHUB_ENV"
          fi
      - name: Verify real protected OCI delivery and output masking
        if: matrix.suite == 'protected'
        run: sh scripts/verify/accept-secret-jobs.sh
      - name: Verify real resource values, receipts and private staged inputs
        if: matrix.suite == 'values'
        env:
          LOKI_REQUIRE_SECRET_PROVIDER: '1'
        run: |
          umask 077
          go test -race -count=1 -timeout=3m -v ./modules/secrets/application ./modules/secrets/devtools ./internal/app/secretbroker
      - name: Verify real administrator, agent and foreign UID socket boundaries
        if: matrix.suite == 'values'
        run: |
          set -euo pipefail
          role_bin="$RUNNER_TEMP/loki-role-broker"
          role_worker="$RUNNER_TEMP/loki-source-worker"
          CGO_ENABLED=0 go build -trimpath -o "$role_bin" ./cmd/secret-broker
          CGO_ENABLED=0 go build -trimpath -o "$role_worker" ./cmd/loki
          chmod 0555 "$role_bin"
          chmod 0555 "$role_worker"
          go test -c -o "$RUNNER_TEMP/loki-role-tests" ./internal/app/secretbroker
          chmod 0555 "$RUNNER_TEMP/loki-role-tests"
          sudo env LOKI_SECRET_TEST_DEVTOOLS="$LOKI_SECRET_TEST_DEVTOOLS" \
            LOKI_SECRET_TEST_EXECUTION_CONTRACT="$PWD/packaging/native/execution-contract.json" \
            LOKI_SECRET_TEST_WORKER="$role_worker" \
            LOKI_SECRET_TEST_BROKER="$role_bin" LOKI_REQUIRE_SECRET_ROLES=1 \
            "$RUNNER_TEMP/loki-role-tests" -test.run '^TestRealApplicationRoleSockets$' -test.v -test.timeout=45s
          go test -c -o "$RUNNER_TEMP/loki-host-application-tests" ./internal/host/application
          chmod 0555 "$RUNNER_TEMP/loki-host-application-tests"
          # This fixture reads tracked public config/contract inputs and writes
          # only its own temporary directories, including the tmpfs inbox.
          (
            cd internal/host/application
            sudo env LOKI_REQUIRE_HOST_APP_LAYOUT=1 \
              "$RUNNER_TEMP/loki-host-application-tests" -test.run '^TestHostApplicationGenerationPreparation$' -test.v -test.timeout=30s
          )
          go test -c -o "$RUNNER_TEMP/loki-native-migration-tests" ./internal/host/migration
          chmod 0555 "$RUNNER_TEMP/loki-native-migration-tests"
          (
            cd internal/host/migration
            sudo env LOKI_SECRET_TEST_DEVTOOLS="$LOKI_SECRET_TEST_DEVTOOLS" \
              LOKI_SECRET_TEST_BROKER="$role_bin" LOKI_REQUIRE_NATIVE_MIGRATION=1 \
              "$RUNNER_TEMP/loki-native-migration-tests" -test.run '^(TestRealNativeCandidateNamespaceAndManualProtection|TestNativeMigrationPreparationPreservesSourceAndSelection|TestNativeBootInterlockTiedToOriginalOperation)$' -test.v -test.timeout=1m
          )
          go test -c -o "$RUNNER_TEMP/loki-host-maintenance-tests" ./internal/app/launcher
          chmod 0555 "$RUNNER_TEMP/loki-host-maintenance-tests"
          sudo env LOKI_REQUIRE_HOST_MAINTENANCE=1 \
            "$RUNNER_TEMP/loki-host-maintenance-tests" -test.run '^TestHostMaintenanceKernelUIDBoundary$' -test.v -test.timeout=30s
          go test -c -o "$RUNNER_TEMP/loki-host-preparation-cli-tests" ./cmd/loki
          chmod 0555 "$RUNNER_TEMP/loki-host-preparation-cli-tests"
          (
            cd cmd/loki
            sudo env LOKI_REQUIRE_HOST_APP_LAYOUT=1 \
              "$RUNNER_TEMP/loki-host-preparation-cli-tests" -test.run '^TestHost(PrepareSecretsFrozenRoles|OfflineMaintenanceJournalLock|NativeSwitchOriginalOperationAndOfflineFence|NativeResourcePolicyReplayAndRollback)$' -test.v -test.timeout=30s
          )
      - name: Prepare the native disposable VM prerequisites
        if: matrix.suite == 'reboot' || startsWith(matrix.suite, 'native-')
        run: |
          sudo apt-get update -qq
          case "$(uname -m)" in
            x86_64) vm_packages=(qemu-system-x86) ;;
            aarch64) vm_packages=(qemu-system-arm qemu-efi-aarch64) ;;
            *) exit 1 ;;
          esac
          sudo apt-get install --no-install-recommends -y "${vm_packages[@]}" qemu-utils cloud-image-utils xorriso apparmor
          # Use the standard runner's existing hardware accelerator when
          # available. Access is private to this disposable job's runner UID.
          if [[ -c /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
      - name: Verify actual native protected Job reboot, cleanup and coordination isolation
        if: matrix.suite == 'reboot'
        run: |
          umask 077
          python3 scripts/verify/accept-secret-reboot.py --devtools "$LOKI_SECRET_TEST_DEVTOOLS"
      - name: Verify native public migration and original-operation reboot recovery
        if: matrix.suite == 'native-migration'
        run: |
          umask 077
          python3 scripts/verify/accept-secret-reboot.py --devtools "$LOKI_SECRET_TEST_DEVTOOLS" --scenario migration
      - name: Verify native rollback and saved-plan replay in a separate VM
        if: matrix.suite == 'native-rollback'
        run: |
          umask 077
          python3 scripts/verify/accept-secret-reboot.py --devtools "$LOKI_SECRET_TEST_DEVTOOLS" --scenario rollback
      - name: Record the exact verification basis
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          RESULT: ${{ job.status }}
        run: |
          printf '| Commit | Architecture | Suite | Result |\n| --- | --- | --- | --- |\n| %s | %s | %s | %s |\n' \
            "$GITHUB_SHA" "$(uname -m)" "$SUITE" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nThis job covers the implemented source at this commit. Pending service/reboot/migration gates are not implied by this result.\n' >> "$GITHUB_STEP_SUMMARY"

  maintainer:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify packaging and release planning fixtures without publishing
        run: python3 -m unittest discover -s scripts/maintainer/tools -p 'test_*.py'
