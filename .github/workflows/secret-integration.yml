name: Secret integration native verification

on:
  push:
    branches: ['verify/secret-integration']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Public-repository standard runners are free. Do not silently start consuming
# a private repository's paid minutes if the repository visibility changes.
# Logs and step summaries retain evidence without storing binary artifacts/caches.
jobs:
  native:
    if: github.event.repository.private == false
    name: ${{ matrix.runner }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite: [values, source, protected, oci, race-0, race-1]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify native execution and prerequisites
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ARCH:$(uname -m):$(go env GOARCH)" in
            X64:x86_64:amd64|ARM64:aarch64:arm64) ;;
            *) echo 'Native architecture mismatch' >&2; exit 1 ;;
          esac
          git rev-parse HEAD
          go version
          uname -a
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker
            docker info >/dev/null
          fi
          docker buildx version
      - name: Prepare the pinned native search test prerequisite
        if: matrix.suite == 'source' || startsWith(matrix.suite, 'race-')
        run: python3 scripts/maintainer/tools/prepare_test_tools.py --output "$RUNNER_TEMP/test-tools"
      - name: Verify source contracts, architecture and build
        if: matrix.suite == 'source'
        run: |
          umask 077
          sh scripts/verify/verify-source.sh
      - name: Run complete race coverage in package shards
        if: startsWith(matrix.suite, 'race-')
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          umask 077
          # Stable sorted partition: every package appears in exactly one shard.
          # Each architecture runs both shards; no test-name filters are applied.
          package_list=$(go list ./... | LC_ALL=C sort)
          mapfile -t packages <<< "$package_list"
          selected=()
          shard=${SUITE#race-}
          for index in "${!packages[@]}"; do
            if (( index % 2 == shard )); then selected+=("${packages[index]}"); fi
          done
          test "${#selected[@]}" -gt 0
          printf 'race shard %s/2: %s of %s packages\n' "$shard" "${#selected[@]}" "${#packages[@]}"
          go test -race -count=1 -timeout=10m "${selected[@]}"
      - name: Verify real OCI lifecycle, networking and recovery
        if: matrix.suite == 'oci'
        run: sh scripts/verify/accept-oci-jobs.sh
      - name: Build the hash-verified pinned devtools provider
        if: matrix.suite == 'protected' || matrix.suite == 'values'
        run: |
          set -euo pipefail
          umask 077
          provider_root=$(mktemp -d "$RUNNER_TEMP/loki-provider.XXXXXXXX")
          curl --fail --location --retry 3 \
            https://codeload.github.com/jinyongp/devtools/tar.gz/ebf18cfb922c14e8a0b3200284f596fd56d13f20 \
            --output "$provider_root/source.tar.gz"
          printf '%s  %s\n' 6f17eaeef05f0427862fa8a12db22d53fa53a9a10933af032c5c84ddfb41aa80 "$provider_root/source.tar.gz" | sha256sum --check --strict
          mkdir "$provider_root/source"
          tar -xzf "$provider_root/source.tar.gz" --strip-components=1 -C "$provider_root/source"
          (
            cd "$provider_root/source"
            CGO_ENABLED=0 go build -trimpath \
              -ldflags '-X main.version=0.30.1 -X main.commit=ebf18cfb922c14e8a0b3200284f596fd56d13f20' \
              -o "$provider_root/devtools" ./cmd/devtools
          )
          # The canary runs the provider as UID1000. Build outputs created under
          # umask077 would otherwise only be executable by the runner owner.
          chmod 0555 "$provider_root/devtools"
          printf 'LOKI_SECRET_TEST_DEVTOOLS=%s\n' "$provider_root/devtools" >> "$GITHUB_ENV"
          if [[ '${{ matrix.suite }}' == values ]]; then
            mkdir "$provider_root/source/cmd/loki-expiry-fixture"
            cp modules/secrets/application/testdata/provider-expired/main.go "$provider_root/source/cmd/loki-expiry-fixture/main.go"
            (
              cd "$provider_root/source"
              CGO_ENABLED=0 go build -buildvcs=false -trimpath -o "$provider_root/expiry-fixture" ./cmd/loki-expiry-fixture
            )
            chmod 0555 "$provider_root/expiry-fixture"
            printf 'LOKI_SECRET_TEST_EXPIRED_FIXTURE=%s\n' "$provider_root/expiry-fixture" >> "$GITHUB_ENV"
          fi
      - name: Verify real protected OCI delivery and output masking
        if: matrix.suite == 'protected'
        run: sh scripts/verify/accept-secret-jobs.sh
      - name: Verify real resource values, receipts and private staged inputs
        if: matrix.suite == 'values'
        env:
          LOKI_REQUIRE_SECRET_PROVIDER: '1'
        run: |
          umask 077
          go test -race -count=1 -timeout=3m -v ./modules/secrets/application
      - name: Verify real administrator, agent and foreign UID socket boundaries
        if: matrix.suite == 'values'
        run: |
          set -euo pipefail
          role_bin="$RUNNER_TEMP/loki-role-broker"
          CGO_ENABLED=0 go build -trimpath -o "$role_bin" ./cmd/secret-broker
          chmod 0555 "$role_bin"
          go test -c -o "$RUNNER_TEMP/loki-role-tests" ./internal/app/secretbroker
          chmod 0555 "$RUNNER_TEMP/loki-role-tests"
          sudo env LOKI_SECRET_TEST_DEVTOOLS="$LOKI_SECRET_TEST_DEVTOOLS" \
            LOKI_SECRET_TEST_BROKER="$role_bin" LOKI_REQUIRE_SECRET_ROLES=1 \
            "$RUNNER_TEMP/loki-role-tests" -test.run '^TestRealApplicationRoleSockets$' -test.v -test.timeout=45s
      - name: Record the exact verification basis
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          RESULT: ${{ job.status }}
        run: |
          printf '| Commit | Architecture | Suite | Result |\n| --- | --- | --- | --- |\n| %s | %s | %s | %s |\n' \
            "$GITHUB_SHA" "$(uname -m)" "$SUITE" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nThis job covers the implemented source at this commit. Pending service/reboot/migration gates are not implied by this result.\n' >> "$GITHUB_STEP_SUMMARY"

  maintainer:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify packaging and release planning fixtures without publishing
        run: python3 -m unittest discover -s scripts/maintainer/tools -p 'test_*.py'
