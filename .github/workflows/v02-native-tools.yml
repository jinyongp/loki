name: Loki 0.2 native tool candidates and final checks

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare only, or prepare then run final native checks
        type: choice
        required: true
        default: prepare
        options: [prepare, validate]
      mode:
        description: Native project browser, or Linux full candidate
        type: choice
        required: true
        default: project-host
        options: [project-host, full]
      inputs_run:
        description: This repository's run containing independently reviewed native input receipts and archives
        type: string
        required: true
      inputs_artifact:
        description: Reviewed input artifact name; includes candidate-OS-ARCH-MODE.json and referenced inputs
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  candidates:
    name: Prepare native tools (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.mode == 'full' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.inputs_artifact }}
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: reviewed-native-inputs
      - name: Restore authenticated Ubuntu keyring permissions on the disposable runner
        if: inputs.mode == 'full'
        shell: bash
        run: |
          printf '%s  %s\n' '80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31' '/usr/share/keyrings/ubuntu-archive-keyring.gpg' | sha256sum --check --strict
          sudo chmod 0644 /usr/share/keyrings/ubuntu-archive-keyring.gpg
      - name: Prepare the exact native target
        env:
          CANDIDATE_MODE: ${{ inputs.mode }}
        run: python3 scripts/maintainer/v02/prepare_native_ci.py --inputs reviewed-native-inputs --output native-tool-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: loki-v02-tools-${{ matrix.runner }}-${{ inputs.mode }}
          path: native-tool-candidate/
          if-no-files-found: error

  final-native-checks:
    name: Final native tool checks (${{ matrix.runner }})
    needs: candidates
    if: inputs.phase == 'validate'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.mode == 'full' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: loki-v02-tools-${{ matrix.runner }}-${{ inputs.mode }}
          path: native-tool-candidate/
      - name: Check native management and transport fixtures
        run: go test ./cmd/loki-manager ./internal/tools ./internal/management ./internal/platform/command ./internal/transport/toolproxy ./modules/browser
      - name: Accept the exact native manager
        run: python3 scripts/maintainer/v02/accept_manager_bundle.py --candidate native-tool-candidate/manager
      - name: Allow the owned test Chrome to create its sandbox on the disposable Ubuntu runner
        if: inputs.mode == 'project-host' && runner.os == 'Linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/loki-native-browser-acceptance" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile loki-native-browser-acceptance /tmp/loki-browser-accept-*/management/tools/browser/generations/*/chrome/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace "$RUNNER_TEMP/loki-native-browser-acceptance"
      - name: Accept packaged independent browser engines and lifecycle
        if: inputs.mode == 'project-host'
        run: python3 scripts/maintainer/v02/accept_browser_candidate.py --candidate native-tool-candidate
      - name: Accept optional capabilities and owned output bytes
        if: inputs.mode == 'project-host'
        run: python3 scripts/maintainer/v02/accept_browser_capabilities.py --candidate native-tool-candidate
      - name: Remove the owned disposable runner sandbox profile
        if: always() && inputs.mode == 'project-host' && runner.os == 'Linux'
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/loki-native-browser-acceptance"; then
            sudo apparmor_parser --remove "$RUNNER_TEMP/loki-native-browser-acceptance"
          fi
