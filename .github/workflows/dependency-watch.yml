name: Dependency update proposals

on:
  schedule:
    - cron: '17 1 * * 1' # Monday 10:17 Asia/Seoul; advisory, not a release gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loki-dependency-watch
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Investigate official upstream metadata and refresh the one tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/maintainer/tools/dependency_watch.py --output dependency-report/report.json --publish
      - name: Retain investigation results, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-investigation
          path: dependency-report/report.json
          if-no-files-found: warn
          retention-days: 14
