name: Loki 0.2 macOS browser input signatures

on:
  workflow_dispatch:
    inputs:
      inputs_run:
        description: Reviewed browser input run from this repository
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: loki-v02-reviewed-project-browser-inputs
          run-id: ${{ inputs.inputs_run }}
          github-token: ${{ github.token }}
          path: reviewed-native-inputs
      - name: Inspect exact original signature metadata without browser startup
        run: python3 scripts/maintainer/v02/inspect_macos_browser_input.py --inputs reviewed-native-inputs
