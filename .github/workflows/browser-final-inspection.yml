name: Loki 0.2 retained browser final diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Retained preparation run for this repository
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: loki-tools-${{ matrix.runner }}-project-host
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: native-tool-candidate
      - name: Diagnose native Intel rendering with sandbox enabled
        if: runner.os == 'macOS'
        run: python3 scripts/maintainer/tools/inspect_browser_rendering.py --candidate native-tool-candidate
      - name: Diagnose native Windows painting with sandbox enabled
        if: runner.os == 'Windows'
        run: python3 scripts/maintainer/tools/inspect_browser_rendering.py --candidate native-tool-candidate
