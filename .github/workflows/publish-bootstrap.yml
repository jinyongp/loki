name: Validate and publish installer correction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loki-tools-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bind correction to verified immutable 0.2.3 assets
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/maintainer/tools/prepare_bootstrap.py --output publication
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accepted-bootstrap-inputs
          path: publication
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accepted-bootstrap-inputs
          path: publication
      - name: Accept native CLI-only installation
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/maintainer/tools/accept_cli_installer.py --publication publication
      - name: Accept advertised prompt-free Windows IEX entry
        if: runner.os == 'Windows'
        run: python scripts/maintainer/tools/accept_iex_installer.py --publication publication
  stage:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accepted-bootstrap-inputs
          path: publication
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: publication/pages
  pages:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
  verify-public:
    needs: [prepare, pages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accepted-bootstrap-inputs
          path: publication
      - run: python3 scripts/maintainer/tools/verify_public_release.py --expected-directory publication/pages
