name: Loki 0.2 native manager candidate and final checks

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare artifacts, or prepare then validate after implementation is complete
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - validate

permissions:
  contents: read

jobs:
  candidates:
    name: Prepare native manager (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - name: Prepare management-only native artifact
        run: python3 scripts/maintainer/tools/build_manager_bundle.py --output native-manager-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: loki-tools-manager-${{ matrix.runner }}
          path: native-manager-candidate/
          if-no-files-found: error

  final-native-checks:
    name: Final native manager checks (${{ matrix.runner }})
    needs: candidates
    if: inputs.phase == 'validate'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: loki-tools-manager-${{ matrix.runner }}
          path: native-manager-candidate/
      - name: Check portable contracts and lifecycle fixtures
        run: go test ./cmd/loki-manager ./internal/tools ./internal/management ./internal/platform/command ./internal/transport/toolproxy ./modules/browser
      - name: Accept the exact native manager artifact in temporary directories
        run: python3 scripts/maintainer/tools/accept_manager_bundle.py --candidate native-manager-candidate
      - name: Accept the one-command management installer
        run: python3 scripts/maintainer/tools/accept_public_installer.py --candidate native-manager-candidate
